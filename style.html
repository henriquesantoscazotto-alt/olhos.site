<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ACESSO RESTRITO</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: #0a0a0a;
    color: #d0d0d0;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Efeito de vinheta sombria */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 0%, #000 100%);
    pointer-events: none;
    z-index: 1;
  }

  /* Ruído sutil */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, transparent 1px, transparent 3px);
    pointer-events: none;
    z-index: 2;
    animation: flicker 4s infinite;
  }

  @keyframes flicker {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.6; }
  }

  .container {
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 40px;
  }

  h1 {
    font-size: 1.2rem;
    letter-spacing: 0.8em;
    font-weight: 300;
    color: #666;
    margin-bottom: 60px;
    text-transform: uppercase;
    padding-left: 0.8em;
  }

  .instruction {
    font-size: 0.75rem;
    color: #444;
    letter-spacing: 0.3em;
    margin-bottom: 25px;
    text-transform: uppercase;
  }

  input {
    background: transparent;
    border: none;
    border-bottom: 1px solid #333;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    font-size: 1.3rem;
    padding: 12px 20px;
    text-align: center;
    letter-spacing: 0.4em;
    outline: none;
    width: 320px;
    transition: border-color 0.4s ease, color 0.4s ease;
    caret-color: #888;
  }

  input:focus {
    border-bottom-color: #888;
  }

  input.error {
    border-bottom-color: #5a1010;
    color: #8a2020;
    animation: shake 0.4s;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .message {
    margin-top: 25px;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: #5a1010;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.5s;
    height: 16px;
  }

  .message.show {
    opacity: 1;
  }

  /* Tela de acesso concedido */
  .granted {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s ease;
  }

  .granted.active {
    opacity: 1;
    pointer-events: all;
  }

  .granted span {
    color: #d0d0d0;
    letter-spacing: 0.8em;
    font-size: 1rem;
    text-transform: uppercase;
    padding-left: 0.8em;
  }

  /* Botão de som */
  .sound-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 5;
    background: transparent;
    border: 1px solid #222;
    color: #555;
    width: 40px;
    height: 40px;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.3s;
    font-family: 'Courier New', monospace;
  }

  .sound-toggle:hover {
    border-color: #555;
    color: #aaa;
  }
</style>
</head>
<body>

<button class="sound-toggle" id="soundToggle" title="Som">♪</button>

<div class="container">
  <h1>Silentium</h1>
  <div class="instruction">pronuncie a palavra</div>
  <input type="text" id="codeInput" autocomplete="off" spellcheck="false" autofocus>
  <div class="message" id="message">Acesso negado</div>
</div>

<div class="granted" id="granted">
  <span>Acesso Concedido</span>
</div>
</html>
